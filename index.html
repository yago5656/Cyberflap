<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onda de Partículas Interativa Avançada</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #060613;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <canvas id="canvasParticulas"></canvas>

    <script>
        const canvas = document.getElementById('canvasParticulas');
        const ctx = canvas.getContext('2d');

        // Configuração do estado do mouse
        const mouse = {
            x: null,
            y: null,
            raio: 120 // Raio de afastamento das partículas
        };

        // Captura o movimento do mouse
        window.addEventListener('mousemove', (event) => {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        // Limpa a posição do mouse quando ele sai da tela
        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        // Ajusta o tamanho do canvas dinamicamente
        function ajustarTela() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', ajustarTela);
        ajustarTela();

        let tempo = 0;
        const listaParticulas = [];
        const quantidadeParticulas = 140;

        // Inicialização das partículas matemáticas
        for (let i = 0; i < quantidadeParticulas; i++) {
            listaParticulas.push({
                x: (canvas.width / quantidadeParticulas) * i,
                baseY: canvas.height / 2,
                atualX: (canvas.width / quantidadeParticulas) * i,
                atualY: canvas.height / 2,
                tamanho: Math.random() * 3.5 + 1.5,
                velocidade: 0.015 + (i * 0.0001),
                fase: i * 0.08
            });
        }

        function renderizar() {
            // Cria o efeito de rastro neon escuro
            ctx.fillStyle = 'rgba(6, 6, 19, 0.12)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            tempo++;

            listaParticulas.forEach((p, index) => {
                // 1. Cálculo da oscilação natural da onda (Seno + Cosseno)
                const angulo = (tempo * p.velocidade) + p.fase;
                const alvoY = p.baseY + Math.sin(angulo) * 130 * Math.cos(angulo * 0.4);
                const alvoX = p.x;

                // 2. Interação com o mouse (Cálculo de repulsão vetorial)
                if (mouse.x !== null && mouse.x !== undefined) {
                    const dx = mouse.x - p.atualX;
                    const dy = mouse.y - p.atualY;
                    const distancia = Math.sqrt(dx * dx + dy * dy);

                    if (distancia < mouse.raio) {
                        // Calcula a força baseada na proximidade
                        const forca = (mouse.raio - distancia) / mouse.raio;
                        const anguloMouse = Math.atan2(dy, dx);
                        
                        // Empurra a partícula na direção oposta ao mouse
                        p.atualX -= Math.cos(anguloMouse) * forca * 8;
                        p.atualY -= Math.sin(anguloMouse) * forca * 8;
                    }
                }

                // Retorno suave da partícula para a sua posição original da onda (Efeito Mola)
                p.atualX += (alvoX - p.atualX) * 0.08;
                p.atualY += (alvoY - p.atualY) * 0.08;

                // 3. Sistema de cores dinâmicas (Espectro cíclico)
                const matizCor = (tempo * 0.4 + index * 2.5) % 360;
                ctx.fillStyle = `hsla(${matizCor}, 85%, 60%, 0.95)`;

                // Desenha o ponto da partícula
                ctx.beginPath();
                ctx.arc(p.atualX, p.atualY, p.tamanho, 0, Math.PI * 2);
                ctx.fill();

                // 4. Desenha as linhas de conexão entre os pontos vizinhos
                if (index > 0) {
                    const vizinho = listaParticulas[index - 1];
                    ctx.strokeStyle = `hsla(${matizCor}, 60%, 45%, 0.18)`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(vizinho.atualX, vizinho.atualY);
                    ctx.lineTo(p.atualX, p.atualY);
                    ctx.stroke();
                }
            });

            requestAnimationFrame(renderizar);
        }

        // Inicia o loop de animação
        renderizar();
    </script>
</body>
</html>
