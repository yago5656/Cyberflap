<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pacman Solar System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle,#1a1d35,#05060d 75%);
    font-family:Arial, Helvetica, sans-serif;
}

/*==============================
ESTRELAS
==============================*/

.stars{
    position:fixed;
    inset:0;
}

.star{
    position:absolute;
    background:#fff;
    border-radius:50%;
    animation:blink 2s infinite alternate;
}

@keyframes blink{
    from{opacity:.2;}
    to{opacity:1;}
}

/*==============================
UNIVERSO
==============================*/

.universe{
    position:relative;
    width:700px;
    height:700px;
}

/*==============================
PACMAN
==============================*/

.pacman{
    position:absolute;
    left:50%;
    top:50%;
    width:100px;
    height:100px;
    transform:translate(-50%,-50%);
    animation:rotatePac 12s linear infinite;
}

.top,
.bottom{
    position:absolute;
    width:100px;
    height:50px;
    background:#FFD700;
    box-shadow:0 0 20px gold;
}

.top{
    border-radius:100px 100px 0 0;
    transform-origin:bottom center;
    animation:mouthTop .22s infinite alternate ease-in-out;
}

.bottom{
    top:50px;
    border-radius:0 0 100px 100px;
    transform-origin:top center;
    animation:mouthBottom .22s infinite alternate ease-in-out;
}

@keyframes mouthTop{
    from{transform:rotate(0deg);}
    to{transform:rotate(-35deg);}
}

@keyframes mouthBottom{
    from{transform:rotate(0deg);}
    to{transform:rotate(35deg);}
}

@keyframes rotatePac{
    from{
        transform:translate(-50%,-50%) rotate(0deg);
    }
    to{
        transform:translate(-50%,-50%) rotate(360deg);
    }
}

/*==============================
ORBITAS
==============================*/

.orbit{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border:1px dashed rgba(255,255,255,.12);
    border-radius:50%;
}

.o1{
    width:180px;
    height:180px;
    animation:spin 4s linear infinite;
}

.o2{
    width:280px;
    height:280px;
    animation:spin 6s linear infinite reverse;
}

.o3{
    width:380px;
    height:380px;
    animation:spin 8s linear infinite;
}

.o4{
    width:500px;
    height:500px;
    animation:spin 10s linear infinite reverse;
}

@keyframes spin{
    from{
        transform:translate(-50%,-50%) rotate(0deg);
    }
    to{
        transform:translate(-50%,-50%) rotate(360deg);
    }
}

/*==============================
FANTASMAS
==============================*/

.ghost{
    position:absolute;
    left:50%;
    top:-24px;
    transform:translateX(-50%);
    width:48px;
    height:48px;
    border-radius:24px 24px 8px 8px;
    animation:float .7s infinite alternate ease-in-out;
}

.red{background:#ff3b3b;}
.pink{background:#ff66cc;}
.blue{background:#31d8ff;}
.orange{background:#ffad33;}

@keyframes float{
    from{
        transform:translateX(-50%) translateY(-3px);
    }
    to{
        transform:translateX(-50%) translateY(3px);
    }
}

/* olhos */

.eye{
    position:absolute;
    width:10px;
    height:14px;
    background:white;
    border-radius:50%;
    top:10px;
}

.left{
    left:10px;
}

.right{
    right:10px;
}

.pupil{
    position:absolute;
    width:4px;
    height:6px;
    background:#0f55ff;
    border-radius:50%;
    bottom:2px;
    right:2px;
}

/* ondas inferiores */

.wave{
    position:absolute;
    bottom:-4px;
    width:100%;
    height:10px;
    background:
    radial-gradient(circle at 6px 0,#05060d 5px,transparent 6px),
    radial-gradient(circle at 18px 0,#05060d 5px,transparent 6px),
    radial-gradient(circle at 30px 0,#05060d 5px,transparent 6px),
    radial-gradient(circle at 42px 0,#05060d 5px,transparent 6px);
}

.title{
    position:absolute;
    top:25px;
    width:100%;
    text-align:center;
    color:white;
    font-size:28px;
    letter-spacing:4px;
    text-shadow:0 0 12px cyan;
}

</style>
</head>
<body>

<div class="stars"></div>

<div class="title">
PACMAN SOLAR SYSTEM
</div>

<div class="universe">

<div class="pacman">
    <div class="top"></div>
    <div class="bottom"></div>
</div>

<div class="orbit o1">
    <div class="ghost red">
        <div class="eye left"><div class="pupil"></div></div>
        <div class="eye right"><div class="pupil"></div></div>
        <div class="wave"></div>
    </div>
</div>

<div class="orbit o2">
    <div class="ghost pink">
        <div class="eye left"><div class="pupil"></div></div>
        <div class="eye right"><div class="pupil"></div></div>
        <div class="wave"></div>
    </div>
</div>

<div class="orbit o3">
    <div class="ghost blue">
        <div class="eye left"><div class="pupil"></div></div>
        <div class="eye right"><div class="pupil"></div></div>
        <div class="wave"></div>
    </div>
</div>

<div class="orbit o4">
    <div class="ghost orange">
        <div class="eye left"><div class="pupil"></div></div>
        <div class="eye right"><div class="pupil"></div></div>
        <div class="wave"></div>
    </div>
</div>

</div>

<script>

// Estrelas

const stars=document.querySelector(".stars");

for(let i=0;i<300;i++){

    const star=document.createElement("div");

    star.className="star";

    const s=Math.random()*3+1;

    star.style.width=s+"px";
    star.style.height=s+"px";

    star.style.left=Math.random()*100+"vw";
    star.style.top=Math.random()*100+"vh";

    star.style.animationDuration=(Math.random()*2+1)+"s";

    stars.appendChild(star);

}

</script>

</body>
</html>
