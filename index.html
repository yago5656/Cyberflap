<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyberpunk Flappy Particle</title>
    <!-- Importando a fonte Orbitron que aparece no seu código -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #000000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            box-shadow: 0 0 30px rgba(0, 255, 242, 0.2);
            border: 2px solid #00fff2;
        }
        /* Estilização da scrollbar caso necessário */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #060613;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff007f;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Configuração de Tela (Proporção Mobile/Arcade 9:16)
        function ajustarTela() {
            const alturaJanela = window.innerHeight;
            canvas.height = alturaJanela;
            canvas.width = Math.min(window.innerWidth, alturaJanela * (9 / 16));
        }
        ajustarTela();
        window.addEventListener('resize', ajustarTela);

        // --- SISTEMA DE PARTÍCULAS DO FUNDO (CYBERPUNK WAVE) ---
        let tempoFundo = 0;
        const partículasFundo = [];
        const totalPartículas = 60;
        for (let i = 0; i < totalPartículas; i++) {
            partículasFundo.push({
                x: (canvas.width / totalPartículas) * i,
                baseY: canvas.height * 0.7, // Posicionado na parte inferior
                velocidade: 0.02 + (i * 0.0002),
                fase: i * 0.15
            });
        }

        function desenharFundoCyberpunk() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)'; // Efeito de rastro/blur
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            tempoFundo++;

            partículasFundo.forEach((p, index) => {
                const angulo = (tempoFundo * p.velocidade) + p.fase;
                const y = p.baseY + Math.sin(angulo) * 60 * Math.cos(angulo * 0.5);
                const matiz = (tempoFundo * 0.5 + index * 4) % 360;

                ctx.fillStyle = `hsla(${matiz}, 100%, 60%, 0.4)`;
                ctx.beginPath();
                ctx.arc(p.x, y, 2, 0, Math.PI * 2);
                ctx.fill();

                if (index > 0) {
                    ctx.strokeStyle = `hsla(${matiz}, 100%, 50%, 0.05)`;
                    ctx.beginPath();
                    ctx.moveTo(partículasFundo[index-1].x, partículasFundo[index-1].y_antigo || y);
                    ctx.lineTo(p.x, y);
                    ctx.stroke();
                }
                p.y_antigo = y;
            });
        }

        // --- ENTIADES DO JOGO FLAPPY BIRD ---
        const game = {
            gravidade: 0.4,
            pulo: -7,
            score: 0,
            recorde: 0,
            estado: 'START', // START, PLAYING, GAMEOVER
            velocidadeObstaculos: 3
        };

        const passaro = {
            x: 80,
            y: canvas.height / 2,
            raio: 14,
            velocidadeY: 0,
            resgatar() {
                this.y = canvas.height / 2;
                this.velocidadeY = 0;
            },
            pular() {
                this.velocidadeY = game.pulo;
            },
            atualizar() {
                if (game.estado === 'PLAYING') {
                    this.velocidadeY += game.gravidade;
                    this.y += this.velocidadeY;

                    // Colisão com teto ou chão
                    if (this.y + this.raio > canvas.height || this.y - this.raio < 0) {
                        finalizarJogo();
                    }
                } else if (game.estado === 'START') {
                    // Flutuação boba na tela de início
                    this.y = canvas.height / 2 + Math.sin(tempoFundo * 0.05) * 15;
                }
            },
            desenhar() {
                // Desenha a nave/pássaro Cyberpunk (Triângulo Neon)
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00fff2';
                ctx.fillStyle = '#00fff2';
                ctx.beginPath();
                ctx.moveTo(this.x + 18, this.y);
                ctx.lineTo(this.x - 12, this.y - 12);
                ctx.lineTo(this.x - 12, this.y + 12);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0; // Reseta sombra
            }
        };

        const canos = {
            lista: [],
            espacoEntre: 160,
            largura: 60,
            timer: 0,
            gerar() {
                const alturaMin = 50;
                const alturaMax = canvas.height - this.espacoEntre - alturaMin - 100;
                const alturaSuperior = Math.floor(Math.random() * (alturaMax - alturaMin + 1)) + alturaMin;

                this.lista.push({
                    x: canvas.width,
                    topo: alturaSuperior,
                    fundo: canvas.height - (alturaSuperior + this.espacoEntre),
                    passou: false
                });
            },
            atualizar() {
                if (game.estado !== 'PLAYING') return;

                this.timer++;
                if (this.timer % 100 === 0) this.gerar();

                this.lista.forEach((cano, index) => {
                    cano.x -= game.velocidadeObstaculos;

                    // Colisões AABB com os canos Cyberpunk
                    if (
                        passaro.x + passaro.raio > cano.x &&
                        passaro.x - passaro.raio < cano.x + this.largura
                    ) {
                        if (passaro.y - passaro.raio < cano.topo || passaro.y + passaro.raio > canvas.height - cano.fundo) {
                            finalizarJogo();
                        }
                    }

                    // Marcar ponto
                    if (!cano.passou && cano.x + this.largura < passaro.x) {
                        game.score++;
                        cano.passou = true;
                        if (game.score > game.recorde) game.recorde = game.score;
                    }

                    // Remove canos fora da tela
                    if (cano.x + this.largura < 0) this.lista.splice(index, 1);
                });
            },
            desenhar() {
                this.lista.forEach(cano => {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#ff007f';
                    ctx.fillStyle = 'rgba(255, 0, 127, 0.2)';
                    ctx.strokeStyle = '#ff007f';
                    ctx.lineWidth = 2;

                    // Cano Superior
                    ctx.fillRect(cano.x, 0, this.largura, cano.topo);
                    ctx.strokeRect(cano.x, -5, this.largura, cano.topo + 5);

                    // Cano Inferior
                    ctx.fillRect(cano.x, canvas.height - cano.fundo, this.largura, cano.fundo);
                    ctx.strokeRect(cano.x, canvas.height - cano.fundo, this.largura, cano.fundo + 5);
                    
                    ctx.shadowBlur = 0;
                });
            }
        };

        function finalizarJogo() {
            game.estado = 'GAMEOVER';
        }

        function resetarJogo() {
            game.score = 0;
            canos.lista = [];
            canos.timer = 0;
            passaro.resgatar();
            game.estado = 'PLAYING';
        }

        // --- CONTROLES (Toque e Teclado) ---
        function interagir() {
            if (game.estado === 'START') {
                resetarJogo();
            } else if (game.estado === 'PLAYING') {
                passaro.pular();
            } else if (game.estado === 'GAMEOVER') {
                game.estado = 'START';
            }
        }

        window.addEventListener('keydown', (e) => { if (e.code === 'Space') interagir(); });
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); interagir(); });

        // --- LOOP PRINCIPAL DE RENDERIZAÇÃO ---
        function loop() {
            desenharFundoCyberpunk();

            canos.atualizar();
            canos.desenhar();

            passaro.atualizar();
            passaro.desenhar();

            // Interface de Texto (HUD) usando a fonte Orbitron do seu projeto
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';

            if (game.estado === 'START') {
                ctx.font = 'bold 24px "Orbitron"';
                ctx.fillStyle = '#00fff2';
                ctx.fillText('CYBER FLAPPY', canvas.width / 2, canvas.height * 0.35);
                ctx.font = '14px "Orbitron"';
                ctx.fillStyle = '#ffffff';
                ctx.fillText('TOQUE PARA INICIAR', canvas.width / 2, canvas.height * 0.6);
            } else if (game.estado === 'PLAYING') {
                ctx.font = 'bold 32px "Orbitron"';
                ctx.fillText(game.score, canvas.width / 2, 80);
            } else if (game.estado === 'GAMEOVER') {
                ctx.font = 'bold 28px "Orbitron"';
                ctx.fillStyle = '#ff007f';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height * 0.35);
